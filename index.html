<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Düğün Davetiyesi</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#f6f2ec;
  font-family: 'Montserrat', sans-serif;
}

.cover{
  width:100%;
  max-width:360px;
  height:540px;
  background:#fdfbf7;
  border-radius:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.15);
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
  cursor:pointer;
}

.cover-inner{
  padding:42px 26px;
  border:1px solid #d6c48f;
  border-radius:18px;
}

.fade{
  opacity:0;
  animation:fadeIn 1.2s forwards;
}

.delay1{ animation-delay:.3s }
.delay2{ animation-delay:.8s }
.delay3{ animation-delay:1.3s }

@keyframes fadeIn{
  to{ opacity:1 }
}

h1{
  font-size:26px;
  color:#6b5b2e;
  margin:20px 0;
  font-weight:600;
}

p{
  font-size:15px;
  color:#444;
  line-height:1.6;
}

.tap{
  margin-top:28px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="cover">
  <div class="cover-inner">
    <p class="fade delay1">
      Bir ömür boyu sürecek “biz”e ilk adımı atıyoruz.<br>
      Bu mutluluğa ortak olmanız dileğiyle…
    </p>

    <h1 class="fade delay2">
      BİZ EVLENİYORUZ 💍
    </h1>

    <p class="fade delay3">
      Spoiler: Mutlu son!
    </p>

    <div class="tap fade delay3">
      Davetiyeyi açmak için dokunun
    </div>
  </div>
</div>

</body>
</html>
